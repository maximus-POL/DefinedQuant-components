[project]
name = "defined-quant"
version = "0.1.3"
description = "Governed, inspectable financial methods for humans and agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = [
  "hypothesis",
  "jsonschema",
  "mypy",
  "pytest",
  "pyyaml",
  "ruff",
]

[build-system]
requires = ["hatchling", "pydantic>=2.7,<3", "pyyaml"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "authoring/hatch_build.py"

[tool.hatch.build.targets.wheel]
only-include = ["shared", "categories", "protocol"]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
  "shared/__init__.py",
  "shared/py.typed",
  "shared/README.md",
  "protocol/__init__.py",
  "protocol/py.typed",
  "protocol/README.md",
]
dev-mode-dirs = ["shared", "categories", "protocol"]

[tool.hatch.build.targets.wheel.sources]
"shared" = "defined_quant"
"categories" = "defined_quant"
"protocol" = "defined_quant_protocol"

[tool.hatch.build.targets.wheel.force-include]
"shared/__init__.py" = "defined_quant/__init__.py"
"shared/py.typed" = "defined_quant/py.typed"
"protocol/__init__.py" = "defined_quant_protocol/__init__.py"
"protocol/py.typed" = "defined_quant_protocol/py.typed"
"registry" = "defined_quant/registry_data"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "-p", "authoring.pytest_evidence",
  "-p", "authoring.pytest_native_inventory",
]
testpaths = ["categories", "authoring/tests", ".agents/skills", "tests"]
python_files = ["test_*.py"]
pythonpath = [".", "adapters/dq_native/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
