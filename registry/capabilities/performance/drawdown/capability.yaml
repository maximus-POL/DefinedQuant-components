schema_version: 2
id: performance.drawdown
version: 1.0.0
title: Running-peak drawdown calculation
kind: calculation
summary: Calculates a complete underwater path and one deterministic maximum-drawdown episode.
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - prices
  properties:
    prices:
      type: array
      minItems: 1
      items:
        type: number
      x-defined-quant-port:
        direction: input
        concept: price_series
        unit: price
        shape: ordered_series
        cardinality: one_or_more
        convention: ordered_positive_prices
        ordering: preserve_source_order
        frequency: inherited
        provenance_requirement: not_required
    timestamps:
      anyOf:
        - type: array
          minItems: 1
          items:
            type: string
            format: date-time
        - type: 'null'
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - drawdown_timestamps
    - drawdowns
    - maximum_drawdown
    - ordering_status
    - peak_index
    - peak_timestamp
    - recovered
    - recovery_index
    - recovery_timestamp
    - running_peak_indices
    - trough_index
    - trough_timestamp
  properties:
    drawdown_timestamps:
      anyOf:
        - type: array
          minItems: 1
          items:
            type: string
            format: date-time
        - type: 'null'
    drawdowns:
      type: array
      minItems: 1
      items:
        type: number
        exclusiveMinimum: -1.0
        maximum: 0.0
      x-defined-quant-port:
        direction: output
        concept: drawdown_series
        unit: decimal
        shape: ordered_series
        cardinality: one_or_more
        convention: running_peak_drawdown
        ordering: preserve_source_order
        frequency: inherited
        provenance_requirement: not_required
    maximum_drawdown:
      type: number
      exclusiveMinimum: -1.0
      maximum: 0.0
      x-defined-quant-port:
        direction: output
        concept: maximum_drawdown
        unit: decimal
        shape: scalar
        cardinality: exactly_one
        convention: running_peak_drawdown
        ordering: not_applicable
        frequency: inherited
        provenance_requirement: not_required
    ordering_status:
      type: string
      enum:
        - verified
        - unverified
    peak_index: {type: integer, minimum: 0}
    peak_timestamp:
      anyOf:
        - {type: string, format: date-time}
        - {type: 'null'}
    recovered: {type: boolean}
    recovery_index:
      anyOf:
        - {type: integer, minimum: 0}
        - {type: 'null'}
    recovery_timestamp:
      anyOf:
        - {type: string, format: date-time}
        - {type: 'null'}
    running_peak_indices:
      type: array
      minItems: 1
      items: {type: integer, minimum: 0}
    trough_index: {type: integer, minimum: 0}
    trough_timestamp:
      anyOf:
        - {type: string, format: date-time}
        - {type: 'null'}
constraints:
  - id: duplicate_timestamps
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: timestamps}
          op: ne
          right: {value: null}
        - left: {field: timestamps, measure: has_duplicates}
          op: eq
          right: {value: true}
    message: Duplicate timestamps are not accepted.
  - id: empty_prices
    target: input
    severity: blocking
    expression:
      left: {field: prices, measure: count}
      op: eq
      right: {value: 0}
    message: At least one price is required.
  - id: non_finite_prices
    target: input
    severity: blocking
    expression:
      left: {field: prices, measure: all_finite}
      op: eq
      right: {value: false}
    message: Every price must be finite.
  - id: non_increasing_timestamps
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: timestamps}
          op: ne
          right: {value: null}
        - left: {field: timestamps, measure: has_duplicates}
          op: eq
          right: {value: false}
        - left: {field: timestamps, measure: is_strictly_increasing}
          op: eq
          right: {value: false}
    message: Timestamps must be strictly increasing and are never silently reordered.
  - id: non_positive_prices
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: prices, measure: all_finite}
          op: eq
          right: {value: true}
        - left: {field: prices, measure: min}
          op: le
          right: {value: 0}
    message: Prices must be strictly positive.
  - id: timestamp_length_mismatch
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: timestamps}
          op: ne
          right: {value: null}
        - left: {field: timestamps, measure: count}
          op: ne
          right: {field: prices, measure: count}
    message: Timestamps and prices must align one-to-one.
