schema_version: 1
capability:
  id: returns.simple
  version: 1.0.0
numeric_model:
  input: finite_ieee_754_binary64
  output: finite_ieee_754_binary64
fixture_encoding:
  binary64: Exact finite floats outside the canonical JSON safe-integer range use a $binary64 hex tag.
cases:
  - id: three_prices_known_answer
    kind: known_answer
    description: Two hand-derived simple returns from three prices.
    input:
      prices:
        - 100.0
        - 105.0
        - 102.9
      timestamps: null
    expected:
      outcome: success
      output:
        returns:
          - 0.05
          - -0.02
        return_kind: simple
        return_timestamps: null
        ordering_status: unverified
      tolerance:
        relative: 1.0e-12
        absolute: 1.0e-12
  - id: interval_end_alignment
    kind: boundary
    description: Return timestamps use the ending observation of each interval.
    input:
      prices:
        - 100.0
        - 101.0
        - 102.0
      timestamps:
        - '2026-07-24T00:00:00Z'
        - '2026-07-27T00:00:00Z'
        - '2026-07-28T00:00:00Z'
    expected:
      outcome: success
      output:
        returns:
          - 0.01
          - 0.009900990099009901
        return_kind: simple
        return_timestamps:
          - '2026-07-27T00:00:00Z'
          - '2026-07-28T00:00:00Z'
        ordering_status: verified
      tolerance:
        relative: 1.0e-12
        absolute: 1.0e-12
  - id: monthly_cross_year_known_answer
    kind: known_answer
    description: Adjacent simple returns used by the Monthly Return Matrix worked example.
    input:
      prices:
        - 100.0
        - 80.0
        - 88.0
        - 79.2
      timestamps: null
    expected:
      outcome: success
      output:
        returns:
          - -0.2
          - 0.1
          - -0.1
        return_kind: simple
        return_timestamps: null
        ordering_status: unverified
      tolerance:
        relative: 1.0e-12
        absolute: 1.0e-12
  - id: close_prices
    kind: numerical_boundary
    description: Adjacent representable prices retain relative precision.
    input:
      prices:
        - {$binary64: '0x1.1c37937e08000p+53'}
        - {$binary64: '0x1.1c37937e08001p+53'}
      timestamps: null
    expected:
      outcome: success
      output:
        returns:
          - 2.0e-16
        return_kind: simple
        return_timestamps: null
        ordering_status: unverified
      tolerance:
        relative: 1.0e-12
        absolute: 0.0
  - id: insufficient_prices
    kind: invalid_input
    input:
      prices:
        - 100.0
      timestamps: null
    expected:
      outcome: failure
      code: insufficient_prices
  - id: non_positive_price
    kind: invalid_input
    input:
      prices:
        - 100.0
        - 0.0
      timestamps: null
    expected:
      outcome: failure
      code: non_positive_prices
  - id: timestamp_length_mismatch
    kind: invalid_input
    input:
      prices:
        - 100.0
        - 101.0
        - 102.0
      timestamps:
        - '2026-07-24T00:00:00Z'
        - '2026-07-27T00:00:00Z'
    expected:
      outcome: failure
      code: timestamp_length_mismatch
  - id: duplicate_timestamps
    kind: invalid_input
    input:
      prices:
        - 100.0
        - 101.0
      timestamps:
        - '2026-07-24T00:00:00Z'
        - '2026-07-24T00:00:00+00:00'
    expected:
      outcome: failure
      code: duplicate_timestamps
  - id: reversed_timestamps
    kind: invalid_input
    input:
      prices:
        - 100.0
        - 101.0
      timestamps:
        - '2026-07-28T00:00:00Z'
        - '2026-07-27T00:00:00Z'
    expected:
      outcome: failure
      code: non_increasing_timestamps
  - id: overflow_result
    kind: numerical_boundary
    input:
      prices:
        - {$binary64: '0x0.730d67819e8d2p-1022'}
        - {$binary64: '0x1.1ccf385ebc8a0p+1023'}
      timestamps: null
    expected:
      outcome: failure
      code: non_finite_result
  - id: rounded_total_loss
    kind: numerical_boundary
    input:
      prices:
        - {$binary64: '0x1.1ccf385ebc8a0p+1023'}
        - {$binary64: '0x0.730d67819e8d2p-1022'}
      timestamps: null
    expected:
      outcome: failure
      code: non_finite_result
invariants:
  - id: terminal_ratio
    statement: Compounding every output reproduces the terminal-to-initial positive price ratio.
  - id: positive_scale_invariance
    statement: Multiplying every price by one positive scale leaves every return unchanged.
  - id: constant_series_zero
    statement: A constant positive price series produces exact zero returns.
