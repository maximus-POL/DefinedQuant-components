schema_version: 1
capability:
  id: returns.log
  version: 1.0.0
numeric_model:
  input: finite_ieee_754_binary64
  output: finite_ieee_754_binary64
cases:
  - id: three_prices_known_answer
    kind: known_answer
    description: Two hand-derived log returns from three prices.
    input:
      prices: [100.0, 105.0, 102.9]
      timestamps: null
    expected:
      outcome: success
      output:
        returns: [0.04879016416943201, -0.020202707317519393]
        return_kind: log
        return_timestamps: null
        ordering_status: unverified
      tolerance: {relative: 1.0e-12, absolute: 1.0e-12}
  - id: interval_end_alignment
    kind: boundary
    input:
      prices: [100.0, 101.0, 102.0]
      timestamps:
        - '2026-07-24T00:00:00Z'
        - '2026-07-27T00:00:00Z'
        - '2026-07-28T00:00:00Z'
    expected:
      outcome: success
      output:
        returns: [0.009950330853168083, 0.00985229644301164]
        return_kind: log
        return_timestamps:
          - '2026-07-27T00:00:00Z'
          - '2026-07-28T00:00:00Z'
        ordering_status: verified
      tolerance: {relative: 1.0e-12, absolute: 1.0e-12}
  - id: close_prices
    kind: numerical_boundary
    input:
      prices:
        - {$binary64: '0x1.1c37937e08000p+53'}
        - {$binary64: '0x1.1c37937e08001p+53'}
      timestamps: null
    expected:
      outcome: success
      output:
        returns: [1.9999999999999997e-16]
        return_kind: log
        return_timestamps: null
        ordering_status: unverified
      tolerance: {relative: 1.0e-12, absolute: 0.0}
  - id: extreme_ratio_rise
    kind: numerical_boundary
    input:
      prices:
        - {$binary64: '0x0.730d67819e8d2p-1022'}
        - {$binary64: '0x1.1ccf385ebc8a0p+1023'}
      timestamps: null
    expected:
      outcome: success
      output:
        returns: [1418.3924172843322]
        return_kind: log
        return_timestamps: null
        ordering_status: unverified
      tolerance: {relative: 1.0e-12, absolute: 1.0e-12}
  - id: extreme_ratio_fall
    kind: numerical_boundary
    input:
      prices:
        - {$binary64: '0x1.1ccf385ebc8a0p+1023'}
        - {$binary64: '0x0.730d67819e8d2p-1022'}
      timestamps: null
    expected:
      outcome: success
      output:
        returns: [-1418.3924172843322]
        return_kind: log
        return_timestamps: null
        ordering_status: unverified
      tolerance: {relative: 1.0e-12, absolute: 1.0e-12}
  - id: insufficient_prices
    kind: invalid_input
    input: {prices: [100.0], timestamps: null}
    expected: {outcome: failure, code: insufficient_prices}
  - id: non_positive_price
    kind: invalid_input
    input: {prices: [100.0, 0.0], timestamps: null}
    expected: {outcome: failure, code: non_positive_prices}
  - id: timestamp_length_mismatch
    kind: invalid_input
    input:
      prices: [100.0, 101.0, 102.0]
      timestamps:
        - '2026-07-24T00:00:00Z'
        - '2026-07-27T00:00:00Z'
    expected: {outcome: failure, code: timestamp_length_mismatch}
  - id: duplicate_timestamps
    kind: invalid_input
    input:
      prices: [100.0, 101.0]
      timestamps:
        - '2026-07-24T00:00:00Z'
        - '2026-07-24T00:00:00+00:00'
    expected: {outcome: failure, code: duplicate_timestamps}
  - id: reversed_timestamps
    kind: invalid_input
    input:
      prices: [100.0, 101.0]
      timestamps:
        - '2026-07-28T00:00:00Z'
        - '2026-07-27T00:00:00Z'
    expected: {outcome: failure, code: non_increasing_timestamps}
invariants:
  - id: terminal_log_difference
    statement: Summing adjacent outputs reproduces the terminal-minus-initial log price.
  - id: positive_scale_invariance
    statement: Multiplying every price by one positive scale leaves every log return unchanged.
  - id: constant_series_zero
    statement: A constant positive price series produces exact zero log returns.
