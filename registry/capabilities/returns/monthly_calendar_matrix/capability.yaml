schema_version: 2
id: returns.monthly_calendar_matrix
version: 1.0.0
title: Monthly return calendar alignment
kind: transformation
summary: Aligns simple returns to consecutive interval-end calendar months for a monthly matrix.
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - observation_months
    - returns
  properties:
    observation_months:
      type: array
      minItems: 2
      items:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
    returns:
      type: array
      minItems: 1
      items:
        type: number
        exclusiveMinimum: -1.0
      x-defined-quant-port:
        direction: input
        concept: periodic_return_series
        unit: decimal
        shape: ordered_series
        cardinality: one_or_more
        convention: simple_periodic_return
        ordering: preserve_source_order
        frequency: inherited
        provenance_requirement: not_required
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - gap_check
    - monthly_returns
    - return_months
  properties:
    gap_check:
      const: verified_consecutive_months
    monthly_returns:
      type: array
      minItems: 1
      items:
        type: number
        exclusiveMinimum: -1.0
      x-defined-quant-port:
        direction: output
        concept: periodic_return_series
        unit: decimal
        shape: ordered_series
        cardinality: one_or_more
        convention: simple_periodic_return
        ordering: preserve_source_order
        frequency: monthly
        provenance_requirement: not_required
    return_months:
      type: array
      minItems: 1
      items:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
constraints:
  - id: duplicate_months
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: observation_months, measure: all_valid_calendar_month_labels}
          op: eq
          right: {value: true}
        - left: {field: observation_months, measure: has_duplicates}
          op: eq
          right: {value: true}
    message: Duplicate month labels are not accepted.
  - id: invalid_month_labels
    target: input
    severity: blocking
    expression:
      left: {field: observation_months, measure: all_valid_calendar_month_labels}
      op: eq
      right: {value: false}
    message: Every month label must use canonical YYYY-MM format.
  - id: non_consecutive_months
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: observation_months, measure: all_valid_calendar_month_labels}
          op: eq
          right: {value: true}
        - left: {field: observation_months, measure: has_duplicates}
          op: eq
          right: {value: false}
        - left: {field: observation_months, measure: is_strictly_increasing}
          op: eq
          right: {value: true}
        - left: {field: observation_months, measure: is_consecutive_calendar_months}
          op: eq
          right: {value: false}
    message: Completed month-end labels must be consecutive without missing months.
  - id: non_increasing_months
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: observation_months, measure: all_valid_calendar_month_labels}
          op: eq
          right: {value: true}
        - left: {field: observation_months, measure: has_duplicates}
          op: eq
          right: {value: false}
        - left: {field: observation_months, measure: is_strictly_increasing}
          op: eq
          right: {value: false}
    message: Month labels must be strictly increasing and are never silently reordered.
  - id: return_count_mismatch
    target: input
    severity: blocking
    expression:
      left: {field: returns, measure: count}
      op: ne
      right: {field: observation_months, measure: interval_count}
    message: Return count must equal the number of adjacent observation-month intervals.
