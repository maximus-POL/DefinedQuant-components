schema_version: 1
capability:
  id: statistics.square_root_annualize
  version: 1.0.0
numeric_model:
  input: finite_ieee_754_binary64
  output: finite_ieee_754_binary64
fixture_encoding:
  binary64: Exact finite floats outside the canonical JSON safe-integer range use a $binary64 hex tag.
cases:
  - id: factor_four_known_answer
    kind: known_answer
    input:
      periodic_value: 0.01414213562373095
      annualization_factor: 4.0
    expected:
      outcome: success
      output: {annualized_value: 0.0282842712474619}
      tolerance: {relative: 1.0e-12, absolute: 1.0e-15}
  - id: zero_dispersion
    kind: boundary
    input:
      periodic_value: 0.0
      annualization_factor: 5.0e-324
    expected:
      outcome: success
      output: {annualized_value: 0.0}
      tolerance: {relative: 0.0, absolute: 0.0}
  - id: overflow
    kind: numerical_boundary
    input:
      periodic_value: {$binary64: '0x1.1ccf385ebc8a0p+1023'}
      annualization_factor: 4.0
    expected: {outcome: failure, code: non_finite_result}
  - id: positive_underflow
    kind: numerical_boundary
    input:
      periodic_value: 5.0e-324
      annualization_factor: 5.0e-324
    expected: {outcome: failure, code: non_finite_result}
invariants:
  - id: factor_one_identity
    statement: An annualization factor of one preserves the periodic value exactly.
  - id: true_zero_preserved
    statement: Exact zero periodic volatility remains zero for every positive finite factor.
