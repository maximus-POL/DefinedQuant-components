schema_version: 2
id: dq.volatility.rolling_historical_volatility
version: 1.0.0
title: Rolling Historical Volatility
lifecycle: draft
summary: >-
  Experimental Technical Preview method for calculating sample volatility over every complete
  window of log returns and annualizing it with an explicit factor.
category: volatility
discovery:
  slug: rolling_historical_volatility
  website_slug: rolling-historical-volatility
  aliases:
    - moving historical volatility
    - rolling annualized volatility
    - rolling realized volatility
    - rolling standard deviation
    - time varying historical volatility
  intents:
    - calculate_rolling_volatility
    - identify_turbulent_periods
    - show_volatility_regimes
  input_concepts:
    - annualization_factor
    - log_return_series
    - return_convention
    - rolling_window_length
  output_concepts:
    - annualized_volatility_series
    - periodic_volatility_series
    - rolling_volatility
  tags:
    - experimental_technical_preview
    - rolling_statistics
    - time_series
    - volatility
  use_when:
    - The caller wants to see when historical trading became more or less turbulent.
    - The caller supplies log returns, an explicit window length, and an explicit annualization factor.
    - Each result should be aligned to the final observation of its complete rolling window.
  do_not_use_when:
    - Returns are simple, unknown, mixed, or need conversion.
    - Window length or annualization factor would have to be inferred.
    - The request is for forecast, implied, downside, or model-based volatility.
  unsupported_scope:
    - Return conversion, data sourcing, cleaning, sorting, resampling, and gap repair.
    - Forecasting, GARCH-family models, implied volatility, downside deviation, and confidence intervals.
    - Automatic window selection, annualization inference, and market-calendar validation.
formula: σ̂ₜ(w) = stdevₙ₋₁(rₜ₋w₊₁, …, rₜ); σ̂annual,ₜ(w) = σ̂ₜ(w) × √A
methodology:
  - Calculate sample standard deviation for every complete fixed-length rolling window.
  - Align each estimate to the final return observation in its window.
  - Apply square-root scaling with the explicit caller-supplied periods-per-year factor.
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - annualization_factor
    - return_kind
    - returns
    - window_length
  properties:
    annualization_factor:
      x-defined-quant-capability-field:
        capability: {id: statistics.square_root_annualize_series, version: 1.0.0}
        direction: input
        field: annualization_factor
    declared_frequency:
      anyOf:
        - type: string
          enum: [intraday, daily, weekly, monthly, quarterly, annual, irregular]
        - type: 'null'
    return_kind:
      const: log
      x-defined-quant-port:
        direction: input
        concept: return_convention
        unit: unitless
        shape: scalar
        cardinality: exactly_one
        convention: log_periodic_return
        ordering: not_applicable
        frequency: not_applicable
        provenance_requirement: not_required
    returns:
      x-defined-quant-capability-field:
        capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
        direction: input
        field: values
    timestamps:
      x-defined-quant-capability-field:
        capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
        direction: input
        field: timestamps
    window_length:
      x-defined-quant-capability-field:
        capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
        direction: input
        field: window_length
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - annualization_factor
    - annualized_volatility
    - declared_frequency
    - gap_check
    - ordering_status
    - periodic_volatility
    - return_kind
    - volatility_timestamps
    - window_length
  properties:
    annualization_factor:
      type: number
      exclusiveMinimum: 0.0
      x-defined-quant-port:
        direction: output
        concept: annualization_factor
        unit: unitless
        shape: scalar
        cardinality: exactly_one
        convention: explicit_periods_per_year_factor
        ordering: not_applicable
        frequency: annual
        provenance_requirement: not_required
    annualized_volatility:
      x-defined-quant-capability-field:
        capability: {id: statistics.square_root_annualize_series, version: 1.0.0}
        direction: output
        field: annualized_values
    declared_frequency:
      anyOf:
        - type: string
          enum: [intraday, daily, weekly, monthly, quarterly, annual, irregular]
        - type: 'null'
    gap_check: {const: not_assessed}
    ordering_status:
      x-defined-quant-capability-field:
        capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
        direction: output
        field: ordering_status
    periodic_volatility:
      x-defined-quant-capability-field:
        capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
        direction: output
        field: standard_deviations
    return_kind:
      const: log
      x-defined-quant-port:
        direction: output
        concept: return_convention
        unit: unitless
        shape: scalar
        cardinality: exactly_one
        convention: log_periodic_return
        ordering: not_applicable
        frequency: not_applicable
        provenance_requirement: not_required
    volatility_timestamps:
      x-defined-quant-capability-field:
        capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
        direction: output
        field: window_end_timestamps
    window_length:
      x-defined-quant-capability-field:
        capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
        direction: output
        field: window_length
assumptions:
  - Supplied observations are comparable decimal log returns from one periodic series.
  - Each complete window uses sample standard deviation with an n minus 1 denominator.
  - Square-root-of-time scaling is acceptable for the supplied annualization factor.
limitations:
  - Adjacent rolling estimates overlap and are not independent observations.
  - The method does not infer frequency, validate a market calendar, or repair gaps.
  - It does not forecast volatility, select a window, estimate uncertainty, or perform robust outlier treatment.
interpretation: >-
  Report complete periodic and explicitly annualized volatility series, window length, factor,
  log-return and n minus 1 conventions, window-end alignment, ordering status, and gap disclosure.
  Describe backward-looking turbulence only; do not imply forecasting or independent estimates.
constraints:
  - id: frequency_without_timestamps
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: declared_frequency}
          op: ne
          right: {value: null}
        - left: {field: timestamps}
          op: eq
          right: {value: null}
    message: A declared frequency requires aligned timestamps.
  - id: ordering_unverified
    target: input
    severity: warning
    expression:
      left: {field: timestamps}
      op: eq
      right: {value: null}
    message: No timestamps were supplied, so chronology could not be verified.
  - id: small_window
    target: input
    severity: warning
    expression:
      all:
        - left: {field: window_length}
          op: ge
          right: {value: 2}
        - left: {field: window_length}
          op: lt
          right: {value: 30}
    message: Fewer than 30 returns per window can produce an unstable descriptive estimate.
conventions:
  - id: annualization_factor
    field: annualization_factor
    question: What explicit number of observation periods per year should be used?
    materiality: The annualized series changes with this factor and it is never inferred.
    required_from_user: true
  - id: return_kind
    field: return_kind
    question: Are the observations log periodic returns?
    materiality: The method accepts the log-return convention only.
    required_from_user: true
    allowed_values: [log]
  - id: window_length
    field: window_length
    question: How many return observations should each complete rolling window contain?
    materiality: Window length materially changes smoothness and regime timing.
    required_from_user: true
defaults:
  - field: declared_frequency
    value: null
    rationale: Frequency is never inferred.
  - field: timestamps
    value: null
    rationale: Timestamps are optional; absence is disclosed as unverified chronology.
recipe:
  steps:
    - step_id: estimate_windows
      capability: {id: statistics.rolling_sample_standard_deviation, version: 1.0.0}
      depends_on: []
      input_bindings:
        - target_field: timestamps
          source: {kind: method_input, field: timestamps}
        - target_field: values
          source: {kind: method_input, field: returns}
        - target_field: window_length
          source: {kind: method_input, field: window_length}
    - step_id: annualize
      capability: {id: statistics.square_root_annualize_series, version: 1.0.0}
      depends_on: [estimate_windows]
      input_bindings:
        - target_field: annualization_factor
          source: {kind: method_input, field: annualization_factor}
        - target_field: periodic_values
          source: {kind: step_output, step_id: estimate_windows, field: standard_deviations}
  result_bindings:
    - target_field: annualization_factor
      source: {kind: method_input, field: annualization_factor}
    - target_field: annualized_volatility
      source: {kind: step_output, step_id: annualize, field: annualized_values}
    - target_field: declared_frequency
      source: {kind: method_input, field: declared_frequency}
    - target_field: gap_check
      source: {kind: authored_constant, value: not_assessed}
    - target_field: ordering_status
      source: {kind: step_output, step_id: estimate_windows, field: ordering_status}
    - target_field: periodic_volatility
      source: {kind: step_output, step_id: estimate_windows, field: standard_deviations}
    - target_field: return_kind
      source: {kind: method_input, field: return_kind}
    - target_field: volatility_timestamps
      source: {kind: step_output, step_id: estimate_windows, field: window_end_timestamps}
    - target_field: window_length
      source: {kind: step_output, step_id: estimate_windows, field: window_length}
