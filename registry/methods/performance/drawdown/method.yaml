schema_version: 2
id: dq.performance.drawdown
version: 1.0.0
title: Drawdown
lifecycle: draft
summary: >-
  Experimental Technical Preview method for measuring every observation below its running peak
  and selecting one deterministic maximum-drawdown episode.
category: performance
discovery:
  slug: drawdown
  website_slug: drawdown
  aliases:
    - crash depth
    - drawdown chart
    - maximum drawdown
    - peak to trough loss
    - underwater chart
  intents:
    - calculate_maximum_drawdown
    - measure_crash_and_recovery
    - show_underwater_path
  input_concepts:
    - ordered_price_series
    - price_adjustment_kind
  output_concepts:
    - drawdown_episode
    - maximum_drawdown
    - underwater_series
  tags:
    - drawdown
    - experimental_technical_preview
    - path_dependent
    - performance
  use_when:
    - The caller wants the depth and shape of losses from running highs.
    - The caller wants the selected peak, trough, and first recovery observation.
    - Ordered positive prices and their adjustment kind are available.
  do_not_use_when:
    - The request is for periodic return volatility, value at risk, or elapsed-time duration.
    - The price path needs sorting, resampling, currency conversion, or corporate-action repair.
    - The sampling window and frequency are not appropriate for the crash being studied.
  unsupported_scope:
    - Return forecasting, probability of loss, value at risk, and risk attribution.
    - Calendar-day or trading-day duration, exchange calendars, and gap inference.
    - Data sourcing, cleaning, sorting, resampling, alignment, and corporate-action repair.
formula: Dₜ = Pₜ / max(P₀, …, Pₜ) − 1; MDD = minₜ Dₜ
methodology:
  - Calculate each observation's decimal loss relative to its running peak.
  - Replace the running-peak index on equal highs and select the earliest deepest trough.
  - For a negative episode, select the first later observation at or above its peak as recovery.
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - price_kind
    - prices
  properties:
    declared_frequency:
      anyOf:
        - type: string
          enum: [intraday, daily, weekly, monthly, quarterly, annual, irregular]
        - type: 'null'
    price_kind:
      type: string
      enum: [adjusted, unadjusted]
      x-defined-quant-port:
        direction: input
        concept: price_adjustment_kind
        unit: unitless
        shape: scalar
        cardinality: exactly_one
        convention: adjusted_or_unadjusted_price_kind
        ordering: not_applicable
        frequency: not_applicable
        provenance_requirement: not_required
    prices:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: input
        field: prices
    timestamps:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: input
        field: timestamps
