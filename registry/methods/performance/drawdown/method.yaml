    - gap_check
    - maximum_drawdown
    - ordering_status
    - peak_index
    - peak_timestamp
    - price_kind
    - recovered
    - recovery_index
    - recovery_timestamp
    - running_peak_indices
    - trough_index
    - trough_timestamp
  properties:
    declared_frequency:
      anyOf:
        - type: string
          enum: [intraday, daily, weekly, monthly, quarterly, annual, irregular]
        - type: 'null'
    drawdown_timestamps:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: output
        field: drawdown_timestamps
    drawdowns:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: output
        field: drawdowns
    gap_check: {const: not_assessed}
    maximum_drawdown:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: output
        field: maximum_drawdown
    ordering_status:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: output
        field: ordering_status
    peak_index:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: output
        field: peak_index
    peak_timestamp:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
        direction: output
        field: peak_timestamp
    price_kind:
      type: string
      enum: [adjusted, unadjusted]
      x-defined-quant-port:
        direction: output
        concept: price_adjustment_kind
        unit: unitless
        shape: scalar
        cardinality: exactly_one
        convention: adjusted_or_unadjusted_price_kind
        ordering: not_applicable
        frequency: not_applicable
        provenance_requirement: not_required
    recovered:
      x-defined-quant-capability-field:
        capability: {id: performance.drawdown, version: 1.0.0}
