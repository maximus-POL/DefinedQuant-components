assumptions:
  - All observations refer to one instrument in a consistent price unit.
  - Caller order is meaningful when timestamps are absent.
  - Adjusted-price semantics are defined upstream and accepted as supplied.
limitations:
  - The result describes only the supplied path and does not estimate probability of loss.
  - Calendar-aware gaps and elapsed-time drawdown duration are not assessed.
  - Data sourcing, cleaning, sorting, resampling, and corporate-action repair are out of scope.
interpretation: >-
  Report the full non-positive underwater series, maximum drawdown, selected peak, trough, and
  recovery identities, deterministic tie conventions, price kind, ordering status, and gap
  disclosure. Do not infer elapsed-time duration, probability, or losses outside the supplied path.
constraints:
  - id: frequency_without_timestamps
    target: input
    severity: blocking
    expression:
      all:
        - left: {field: declared_frequency}
          op: ne
          right: {value: null}
        - left: {field: timestamps}
          op: eq
          right: {value: null}
    message: A declared frequency requires aligned timestamps.
  - id: ordering_unverified
    target: input
    severity: warning
    expression:
      left: {field: timestamps}
      op: eq
      right: {value: null}
    message: No timestamps were supplied, so chronology could not be verified.
  - id: unadjusted_price_interpretation
    target: input
    severity: warning
    expression:
      left: {field: price_kind}
      op: eq
      right: {value: unadjusted}
    message: Corporate-action breaks can appear as drawdowns in unadjusted prices.
conventions:
  - id: price_kind
    field: price_kind
    question: Are the supplied prices adjusted or unadjusted?
    materiality: Corporate actions can create artificial peaks and crashes.
    required_from_user: true
    allowed_values: [adjusted, unadjusted]
defaults:
  - field: declared_frequency
    value: null
    rationale: Frequency is never inferred.
  - field: timestamps
    value: null
    rationale: Timestamps are optional; absence is disclosed as unverified chronology.
recipe:
  steps:
