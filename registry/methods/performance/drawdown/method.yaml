      capability: {id: performance.drawdown, version: 1.0.0}
      depends_on: []
      input_bindings:
        - target_field: prices
          source: {kind: method_input, field: prices}
        - target_field: timestamps
          source: {kind: method_input, field: timestamps}
  result_bindings:
    - target_field: declared_frequency
      source: {kind: method_input, field: declared_frequency}
    - target_field: drawdown_timestamps
      source: {kind: step_output, step_id: calculate, field: drawdown_timestamps}
    - target_field: drawdowns
      source: {kind: step_output, step_id: calculate, field: drawdowns}
    - target_field: gap_check
      source: {kind: authored_constant, value: not_assessed}
    - target_field: maximum_drawdown
      source: {kind: step_output, step_id: calculate, field: maximum_drawdown}
    - target_field: ordering_status
      source: {kind: step_output, step_id: calculate, field: ordering_status}
    - target_field: peak_index
      source: {kind: step_output, step_id: calculate, field: peak_index}
    - target_field: peak_timestamp
      source: {kind: step_output, step_id: calculate, field: peak_timestamp}
    - target_field: price_kind
      source: {kind: method_input, field: price_kind}
    - target_field: recovered
      source: {kind: step_output, step_id: calculate, field: recovered}
    - target_field: recovery_index
      source: {kind: step_output, step_id: calculate, field: recovery_index}
    - target_field: recovery_timestamp
      source: {kind: step_output, step_id: calculate, field: recovery_timestamp}
    - target_field: running_peak_indices
      source: {kind: step_output, step_id: calculate, field: running_peak_indices}
    - target_field: trough_index
      source: {kind: step_output, step_id: calculate, field: trough_index}
