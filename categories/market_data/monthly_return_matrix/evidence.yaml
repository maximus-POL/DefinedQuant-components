  "known_answers": [
    {
      "id": "ka_001",
      "description": "Three monthly returns crossing a calendar-year boundary.",
      "inputs": {
        "prices": [
          100.0,
          80.0,
          88.0,
          79.2
        ],
        "months": [
          "2022-11",
          "2022-12",
          "2023-01",
          "2023-02"
        ],
        "price_kind": "adjusted",
        "observation_kind": "completed_month_end"
      },
      "expect": {
        "outcome": "success",
        "assertions": [
          {
            "path": "/monthly_returns",
            "op": "approx",
            "value": [
              -0.2,
              0.1,
              -0.1
            ],
            "rtol": 1e-12,
            "atol": 1e-12
          },
          {
            "path": "/return_months",
            "op": "equal",
            "value": [
              "2022-12",
              "2023-01",
              "2023-02"
            ]
          },
          {
            "path": "/gap_check",
            "op": "equal",
            "value": "verified_consecutive_months"
          },
          {
            "path": "/derivations",
            "op": "length_equal",
            "value": 3
          }
        ]
      },
      "provenance": {
        "kind": "author_derivation",
        "produced_by": "Maksymilian Tylek",
        "citation": "Hand calculation documented in README.md under Worked example."
      }
    }
  ],
  "invariants": [
    {
      "id": "inv_001",
      "test_id": "test_evidence_inv_001",
      "description": "Compounding all simple monthly returns reproduces the final-to-initial price ratio."
    },
    {
      "id": "inv_002",
      "test_id": "test_evidence_inv_002",
