    },
    {
      "id": "inv_004",
      "test_id": "test_evidence_inv_004",
      "description": "Visualization values, units, labels, assumptions, and warnings match the canonical output."
    },
    {
      "id": "inv_005",
      "test_id": "test_evidence_inv_005",
      "description": "Every return has one ordered derivation referencing its exact adjacent source prices."
    }
