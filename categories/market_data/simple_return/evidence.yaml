  "known_answers": [
    {
      "id": "ka_001",
      "description": "Two hand-derived simple returns from three prices.",
      "inputs": {
        "prices": [
          100.0,
          105.0,
          102.9
        ],
        "price_kind": "adjusted"
      },
      "expect": {
        "outcome": "success",
        "assertions": [
          {
            "path": "/returns",
            "op": "approx",
            "value": [
              0.05,
              -0.02
            ],
            "rtol": 1e-12,
            "atol": 1e-12
          },
          {
            "path": "/return_kind",
            "op": "equal",
            "value": "simple"
          },
          {
            "path": "/derivations",
            "op": "length_equal",
            "value": 2
          },
          {
            "path": "/derivations/0/output",
            "op": "equal",
            "value": {
              "field": "returns",
              "index": 0
            }
          },
          {
            "path": "/derivations/0/inputs",
            "op": "equal",
            "value": [
              {
                "field": "prices",
                "index": 0,
                "citation_id": null
              },
              {
                "field": "prices",
                "index": 1,
                "citation_id": null
              }
            ]
          },
          {
            "path": "/derivations/0/expression",
            "op": "equal",
            "value": "(prices[1] - prices[0]) / prices[0]"
          }
        ]
      },
      "provenance": {
        "kind": "author_derivation",
        "produced_by": "Maksymilian Tylek",
        "citation": "Hand calculation documented in README.md under Worked example."
      }
    }
  ],
  "invariants": [
    {
      "id": "inv_001",
      "test_id": "test_evidence_inv_001",
      "description": "Compounding every simple return reproduces the terminal-to-initial price ratio."
    },
    {
      "id": "inv_002",
      "test_id": "test_evidence_inv_002",
