  "known_answers": [
    {
      "id": "ka_001",
      "description": "Two hand-derived log returns from three positive prices.",
      "inputs": {
        "prices": [
          100.0,
          105.0,
          102.9
        ],
        "price_kind": "adjusted"
      },
      "expect": {
        "outcome": "success",
        "assertions": [
          {
            "path": "/returns",
            "op": "approx",
            "value": [
              0.04879016416943201,
              -0.020202707317519466
            ],
            "rtol": 1e-12,
            "atol": 1e-12
          },
          {
            "path": "/return_kind",
            "op": "equal",
            "value": "log"
          },
          {
            "path": "/derivations",
            "op": "length_equal",
            "value": 2
          },
          {
            "path": "/derivations/0/output",
            "op": "equal",
            "value": {
              "field": "returns",
              "index": 0
            }
          },
          {
            "path": "/derivations/0/inputs",
            "op": "equal",
            "value": [
              {
                "field": "prices",
                "index": 0,
                "citation_id": null
              },
              {
                "field": "prices",
                "index": 1,
                "citation_id": null
              }
            ]
          },
          {
            "path": "/derivations/0/expression",
            "op": "equal",
            "value": "log1p((prices[1] - prices[0]) / prices[0])"
          }
        ]
      },
      "provenance": {
        "kind": "author_derivation",
        "produced_by": "Maksymilian Tylek",
        "citation": "Hand calculation documented in README.md under Worked example."
      }
    }
  ],
