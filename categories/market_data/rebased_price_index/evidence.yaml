      "id": "ka_001",
      "description": "Four prices normalized to the second observation at 100.",
      "inputs": {
        "prices": [
          80.0,
          100.0,
          60.0,
          120.0
        ],
        "price_kind": "adjusted",
        "base_index": 1,
        "base_value": 100.0
      },
      "expect": {
        "outcome": "success",
        "assertions": [
          {
            "path": "/index_values",
            "op": "approx",
            "value": [
              80.0,
              100.0,
              60.0,
              120.0
            ],
            "rtol": 1e-12,
            "atol": 1e-12
          },
          {
            "path": "/base_index",
            "op": "equal",
            "value": 1
          },
          {
            "path": "/derivations",
            "op": "length_equal",
            "value": 4
          }
        ]
      },
      "provenance": {
        "kind": "author_derivation",
        "produced_by": "Maksymilian Tylek",
        "citation": "Hand calculation documented in README.md under Worked example."
      }
    }
