      "id": "ka_001",
      "description": "Two symmetric log returns have a hand-derived sample volatility and factor-four annualization.",
      "inputs": {
        "returns": [
          -0.01,
          0.01
        ],
        "annualization_factor": 4.0,
        "return_kind": "log"
      },
      "expect": {
        "outcome": "success",
        "assertions": [
          {
            "path": "/periodic_volatility",
            "op": "approx",
            "value": 0.01414213562373095,
            "rtol": 1e-12,
            "atol": 1e-15
          },
          {
            "path": "/annualized_volatility",
            "op": "approx",
            "value": 0.0282842712474619,
            "rtol": 1e-12,
            "atol": 1e-15
          },
          {
            "path": "/annualization_factor",
            "op": "equal",
            "value": 4.0
          },
          {
            "path": "/sample_size",
            "op": "equal",
            "value": 2
          },
          {
            "path": "/degrees_of_freedom_adjustment",
            "op": "equal",
            "value": 1
          },
          {
            "path": "/return_kind",
            "op": "equal",
            "value": "log"
          },
          {
            "path": "/derivations",
            "op": "length_equal",
            "value": 2
          },
          {
            "path": "/derivations/0/output",
            "op": "equal",
            "value": {
              "field": "periodic_volatility",
              "index": 0
            }
          },
          {
            "path": "/derivations/0/inputs",
            "op": "equal",
            "value": [
              {
                "field": "returns",
                "index": 0,
                "citation_id": null
              },
              {
                "field": "returns",
                "index": 1,
                "citation_id": null
              }
            ]
          },
          {
            "path": "/derivations/0/expression",
            "op": "equal",
            "value": "centered_scaled_hypot_sample_stdev_n_minus_1(returns)"
          },
          {
            "path": "/derivations/1/inputs",
            "op": "equal",
            "value": [
              {
                "field": "returns",
                "index": 0,
                "citation_id": null
              },
              {
                "field": "returns",
                "index": 1,
                "citation_id": null
              },
              {
                "field": "annualization_factor",
                "index": 0,
                "citation_id": null
              }
            ]
          },
          {
            "path": "/derivations/1/expression",
            "op": "equal",
            "value": "centered_scaled_hypot_sample_stdev_n_minus_1(returns) * sqrt(annualization_factor)"
          }
        ]
      },
      "provenance": {
        "kind": "author_derivation",
        "produced_by": "Maksymilian Tylek",
        "citation": "Hand calculation documented in README.md under Worked example."
      }
    }
