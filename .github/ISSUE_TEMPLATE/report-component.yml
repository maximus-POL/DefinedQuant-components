name: Report a problem with a component
description: A wrong result, a misleading explanation, an unclear convention, or a missing limitation.
title: "[Report] "
labels: ["report", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Reports are welcome and are published, not hidden. A confirmed defect unbinds the
        component's evidence, returns it to Draft, and is recorded with its correction.

        **Security issues do not belong here** — see SECURITY.md for private reporting.

  - type: input
    id: component_id
    attributes:
      label: Component ID
      placeholder: dq.statistics.historical_volatility
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Component version
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Wrong numerical result
        - Convention is ambiguous or undocumented
        - Explanation is misleading or incorrect
        - A limitation is missing
        - Constraint should block/warn and does not (or does and should not)
        - Agent guidance is wrong or unenforceable
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected, and why — cite a source if you have one.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem. Synthetic inputs only.
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Python: 3.12.4
        defined-quant: v0.1.0 (or commit sha)
        OS: macOS 15
    validations:
      required: true

  - type: input
    id: subject_hash
    attributes:
      label: Subject hash (if you have it)
      description: "`result.subject_hash`, or the value shown on the component page."
    validations:
      required: false
