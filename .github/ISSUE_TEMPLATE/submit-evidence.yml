name: Submit evidence, a test, or a source
description: Bind independent evidence, a conformance case, a test, or a source to one exact registry subject.
title: "[Evidence] "
labels: ["evidence", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Independent evidence is the most valuable contribution to this project. An independent
        cross-check is the one claim a solo maintainer genuinely cannot produce alone.

        Evidence must bind one exact subject. Method correctness, Capability conformance,
        Implementation behavior, Adapter review, provider authentication, dataset provenance,
        execution integrity, domain review and independent reproduction are distinct claims.

  - type: dropdown
    id: subject_kind
    attributes:
      label: Exact subject kind
      options:
        - Method
        - Capability
        - Backend
        - Adapter
        - Implementation
        - Capability conformance record
        - Existing evidence record
    validations:
      required: true

  - type: textarea
    id: subject_ref
    attributes:
      label: Exact subject reference
      description: |
        Provide one closed reference. Use a contract hash for a Method or Capability, a spec hash
        for a Backend, Adapter or Implementation, and an evidence hash for an existing evidence
        record. A conformance submission binds the exact Capability ref.
      placeholder: |
        id: returns.simple
        version: 1.0.0
        identity_hash: 64 lowercase hexadecimal characters
      render: yaml
    validations:
      required: true

  - type: dropdown
    id: claim_subject
    attributes:
      label: Claim this evidence supports
      options:
        - Method derivation or professional interpretation
        - Capability known answer, boundary, tolerance or invariant
        - Backend identity or operational boundary
        - Adapter input, output, failure mapping or cleanup review
        - Implementation conformance or implementation-specific behavior
        - Independent domain review
        - Independent reproduction
        - Other precisely scoped claim
    validations:
      required: true

  - type: dropdown
    id: evidence_type
    attributes:
      label: Type of evidence
      options:
        - Known-answer value (published or independently derived)
        - Independent implementation cross-check
        - Capability invariant
        - Boundary or limiting case
        - Property-based / randomised test
        - Convergence or numerical-stability result
        - Adapter mapping or failure-translation review
        - Backend operational-boundary source
        - A source, paper or tutorial worth citing
        - Other
    validations:
      required: true

  - type: textarea
    id: values
    attributes:
      label: Inputs and expected outputs
      description: |
        Exact canonical values for numerical evidence or conformance cases. Include every
        convention-bearing input and a declared outcome. Leave blank for a source-only or review
        submission. Do not include executable code, imports, credentials, raw SQL or provider data.
      render: yaml
    validations:
      required: false

  - type: input
    id: tolerance
    attributes:
      label: Tolerance
      description: Required for numerical evidence and tests. An assertion without a stated tolerance is not evidence. Leave blank for a source or tutorial.
      placeholder: rtol=1e-10, atol=1e-12
    validations:
      required: false

  - type: textarea
    id: independence
    attributes:
      label: Independence and relationship to the implementation
      description: |
        Which implementation, publication or derivation produced these values — and how it is
        independent of this repository's code. "I ran the Implementation and copied the output" is not
        independent evidence; say so honestly if that is what happened. State separately whether
        you authored the Method, Capability, Adapter or Implementation. An author may run an implementation-independent
        comparison, but it is not an independent human review.
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Source and permitted use
      description: |
        Citation for published values. Confirm any data is synthetic, openly licensed or yours to
        contribute — vendor, scraped and restricted provider data or responses cannot be accepted.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before submitting
      options:
        - label: I identified the exact subject and disclosed my relationship to its authorship
          required: true
        - label: Any data included is synthetic, seeded and redistributable, or mine to contribute
          required: true
        - label: This submission contains no credentials, secrets, connection strings, private provider responses or executable control fields
          required: true
