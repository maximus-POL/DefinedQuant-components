name: Components

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts, tests, wheel, and catalog / exact SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install locked uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked project
        run: uv sync --locked

      - name: Check contracts and evidence
        run: uv run python authoring/check_component.py

      - name: Run component tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check shared categories authoring

      - name: Type-check installed package projection
        run: uv run --no-editable mypy shared categories authoring/*.py

      - name: Build wheel and source archive
        run: uv build

      - name: Verify installed wheel
        run: |
          uv venv .wheel-check
          uv pip install --python .wheel-check/bin/python dist/*.whl
          .wheel-check/bin/python -c 'from math import isclose; from defined_quant import iter_components; from defined_quant.market_data.simple_return.component import simple_return; assert [item.component_id for item in iter_components()] == ["dq.market_data.simple_return"]; values = simple_return(prices=[100, 101], price_kind="adjusted").returns; assert len(values) == 1 and isclose(values[0], 0.01, rel_tol=0.0, abs_tol=1e-15)'

      - name: Export static catalog for this commit
        run: |
          uv run python authoring/export_catalog.py \
            --commit-sha "${GITHUB_SHA}" \
            --release-version "0.1.0" \
            --release-label "Experimental Technical Preview"

      - name: Upload exact-SHA public artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: defined-quant-components-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/catalog/catalog.json
          if-no-files-found: error
          retention-days: 14
