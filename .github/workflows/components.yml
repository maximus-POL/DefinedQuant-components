name: Components

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-wheels:
    name: Build exact release wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install locked uv and build Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true

      - name: Verify core lock
        run: uv lock --check

      - name: Verify MCP lock
        run: uv lock --project mcp_server --check

      - name: Build and fingerprint core and MCP wheels once
        env:
          DQ_WHEEL_DIRECTORY: ${{ runner.temp }}/defined-quant-release-wheels
        run: uv run --no-project --python 3.13 python authoring/build_release_wheels.py

      - name: Upload exact wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: defined-quant-release-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/defined-quant-release-wheels
          if-no-files-found: error
          retention-days: 14

  verify-native:
    name: Native / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build-release-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Check out exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install locked uv and matrix Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Download exact release wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: defined-quant-release-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/defined-quant-release-wheels

      - name: Run complete native acceptance suite from installed wheels
        env:
          DQ_EXPECTED_PYTHON: ${{ matrix.python }}
          DQ_MEASURE_WORKER_CAPACITY: "1"
          DQ_WHEEL_DIRECTORY: ${{ runner.temp }}/defined-quant-release-wheels
        run: uv run --no-project --python ${{ matrix.python }} python authoring/run_native_wheel_matrix.py

  static-analysis:
    name: Static analysis
    needs: build-release-wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install locked uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked core development environment
        run: uv sync --locked

      - name: Install locked MCP development environment
        run: uv sync --project mcp_server --locked

      - name: Download exact release wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: defined-quant-release-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/defined-quant-release-wheels

      - name: Lint core, protocol, components, authoring, and adapter
        run: uv run ruff check protocol shared categories authoring .agents/skills/use-defined-quant/scripts .agents/skills/use-defined-quant/tests

      - name: Lint MCP transport
        run: uv run --project mcp_server ruff check mcp_server/src mcp_server/tests

      - name: Type-check all installed projections
        env:
          DQ_WHEEL_DIRECTORY: ${{ runner.temp }}/defined-quant-release-wheels
        run: uv run python authoring/run_static_type_checks.py

      - name: Check patch whitespace
        run: git diff --check

  publish-release-extras:
    name: Assemble source archives and catalog
    needs: [build-release-wheels, verify-native, static-analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install locked uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked catalog environment
        run: uv sync --locked

      - name: Build source archives and export exact-commit catalog
        env:
          DQ_COMMIT_SHA: ${{ github.sha }}
        run: uv run python authoring/prepare_release_extras.py

      - name: Upload exact-SHA source and catalog artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: defined-quant-sources-catalog-${{ github.sha }}
          path: |
            dist/source
            dist/catalog/catalog.json
          if-no-files-found: error
          retention-days: 14
