name: Components

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts, tests, wheel, and catalog / exact SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install locked uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked project
        run: uv sync --locked

      - name: Check contracts and evidence
        run: uv run python authoring/check_component.py

      - name: Run component tests
        run: uv run pytest

      - name: Lint
        run: |
          uv run ruff check protocol shared categories authoring \
            .agents/skills/use-defined-quant/scripts \
            .agents/skills/use-defined-quant/tests

      - name: Type-check installed package projection
        run: |
          uv run --no-editable mypy shared categories authoring/*.py
          uv run --no-editable mypy -p defined_quant_protocol

      - name: Build wheel and source archive
        run: uv build

      - name: Verify installed wheel
        run: |
          uv venv .wheel-check
          uv pip install --python .wheel-check/bin/python dist/*.whl
          .wheel-check/bin/python - <<'PY'
          from math import isclose

          from defined_quant import iter_components, load_execution_policy
          from defined_quant.market_data.log_return.component import (
              Output as LogReturnOutput,
              log_return,
          )
          from defined_quant.market_data.simple_return.component import simple_return
          from defined_quant.volatility.historical_volatility.component import (
              Inputs as HistoricalVolatilityInputs,
              historical_volatility,
          )
          from defined_quant_protocol import PROTOCOL_VERSION, require_compatible_ports

          assert PROTOCOL_VERSION == "0.4.0"
          assert [item.component_id for item in iter_components()] == [
              "dq.market_data.log_return",
              "dq.market_data.monthly_return_matrix",
              "dq.market_data.rebased_price_index",
              "dq.market_data.simple_return",
              "dq.performance.drawdown",
              "dq.volatility.historical_volatility",
              "dq.volatility.rolling_historical_volatility",
          ]
          policy = load_execution_policy("simple_return_csv_v1")
          ref = policy.components[0].component
          assert (ref.id, ref.version, ref.subject_hash) == (
              "dq.market_data.simple_return",
              "0.3.4",
              "ca4790d64d5405b7444eaebeee96b2f3257d7260efeb38262194c11617b9b87a",
          )
          simple = simple_return(prices=[100, 101], price_kind="adjusted")
          assert len(simple.returns) == len(simple.derivations) == 1
          assert simple.disclosures
          assert isclose(simple.returns[0], 0.01, rel_tol=0.0, abs_tol=1e-15)
          large = simple_return(prices=[100.0] * 502, price_kind="adjusted")
          assert len(large.returns) == 501
          assert large.visualizations[0].series[0].values == large.returns
          require_compatible_ports(
              LogReturnOutput,
              "returns",
              HistoricalVolatilityInputs,
              "returns",
          )
          logarithmic = log_return(prices=[100, 101, 99], price_kind="adjusted")
          volatility = historical_volatility(
              logarithmic.returns,
              return_kind=logarithmic.return_kind,
              annualization_factor=252.0,
          )
          assert volatility.sample_size == 2
          assert len(volatility.derivations) == 2
          PY

      - name: Export static catalog for this commit
        run: |
          uv run python authoring/export_catalog.py \
            --commit-sha "${GITHUB_SHA}" \
            --release-version "0.1.3" \
            --release-label "Experimental Technical Preview"

      - name: Upload exact-SHA public artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: defined-quant-components-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/catalog/catalog.json
          if-no-files-found: error
          retention-days: 14
