[project]
name = "defined-quant-adapter-dq-native"
version = "1.0.0"
description = "Trusted local DQ-native capability implementations for Defined Quant."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = []

[project.entry-points."defined_quant.adapters"]
dq_native_drawdown = "defined_quant_adapter_dq_native.drawdown.adapter:execute"
dq_native_log_return = "defined_quant_adapter_dq_native.log_return.adapter:execute"
dq_native_monthly_calendar_matrix = "defined_quant_adapter_dq_native.monthly_calendar_matrix.adapter:execute"
dq_native_rebased_price_index = "defined_quant_adapter_dq_native.rebased_price_index.adapter:execute"
dq_native_rolling_sample_standard_deviation = "defined_quant_adapter_dq_native.statistics.rolling_sample_standard_deviation:execute"
dq_native_sample_standard_deviation = "defined_quant_adapter_dq_native.statistics.sample_standard_deviation:execute"
dq_native_simple_return = "defined_quant_adapter_dq_native.simple_return.adapter:execute"
dq_native_square_root_annualize = "defined_quant_adapter_dq_native.statistics.square_root_annualize:execute"
dq_native_square_root_annualize_series = "defined_quant_adapter_dq_native.statistics.square_root_annualize_series:execute"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defined_quant_adapter_dq_native"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
